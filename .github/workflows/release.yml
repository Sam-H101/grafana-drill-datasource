# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v2.0.1
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          # Set the GRAFANA_ROOT_URLS repo variable (comma-separated) for a
          # private signature; leave it unset for a community signature,
          # which needs the plugin approved on grafana.com first.
          sign_root_urls: ${{ vars.GRAFANA_ROOT_URLS }}
          go-version: '1.26'
          node-version: '24'
