# Drill with user authentication, for development and integration tests only.
# Users and passwords are in ./htpasswd (see devenv/drill/README.md).
drill.exec: {
  cluster-id: "drillbits-auth",
  zk.connect: "localhost:2181",
  impersonation: {
    enabled: true,
    max_chained_user_hops: 3
  },
  security.user.auth: {
    enabled: true,
    packages += "org.apache.drill.exec.rpc.user.security",
    impl: "htpasswd",
    htpasswd.path: "/opt/drill/conf/htpasswd"
  },
  http: {
    auth: {
      mechanisms: ["FORM", "BASIC"]
    }
  }
}
