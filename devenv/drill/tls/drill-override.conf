# Drill serving its web port over HTTPS, for development and tests only.
# The keystore is generated at container start by entrypoint.sh.
drill.exec: {
  cluster-id: "drillbits-tls",
  zk.connect: "localhost:2181",
  http.ssl_enabled: true,
  ssl: {
    useHadoopConfig: false,
    keyStoreType: "PKCS12",
    keyStorePath: "/tls/keystore.p12",
    keyStorePassword: "drill-dev-keystore",
    keyPassword: "drill-dev-keystore"
  }
}
