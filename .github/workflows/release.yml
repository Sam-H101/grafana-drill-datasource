# Builds the plugin for every platform and creates a draft GitHub release with
# the zip and its SHA-1 when a version tag is pushed.
# (See https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
#
# Signing, set with repository variables:
#   - Neither variable set: the release is unsigned. A public plugin is
#     submitted to Grafana unsigned; it can be signed only after approval.
#   - GRAFANA_SIGN_RELEASES=true: community signature, once Grafana has approved
#     the plugin and assigned its signature level.
#   - GRAFANA_ROOT_URLS=<comma-separated URLs>: private signature for those
#     Grafana servers.
# Both signatures need the GRAFANA_ACCESS_POLICY_TOKEN secret.
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tag decides the version, so a release created from the GitHub UI
      # builds even if package.json was not bumped first. A tag that is not a
      # version (v1.2.3) fails here, before the build.
      - name: Use the tag as the plugin version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v2.0.2
        with:
          policy_token: ${{ (vars.GRAFANA_SIGN_RELEASES == 'true' || vars.GRAFANA_ROOT_URLS != '') && secrets.GRAFANA_ACCESS_POLICY_TOKEN || '' }}
          sign_root_urls: ${{ vars.GRAFANA_ROOT_URLS }}
          attestation: true
          go-version: '1.26'
          node-version: '24'
